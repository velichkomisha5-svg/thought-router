name: Build iOS Unsigned IPA
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Folder
        run: npx expo prebuild --platform ios

      - name: Compile App without signing
        run: |
          cd ios
          xcodebuild -workspace ThoughtRouter.xcworkspace -scheme ThoughtRouter -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          
      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r ../app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa
